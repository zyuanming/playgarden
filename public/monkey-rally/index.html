<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Monkey Rally · 猴子救援</title>
  <link rel="stylesheet" href="adapter.css">
</head>
<body>
<main id="app" tabindex="0" aria-label="猴子救援操作区">
  <nav aria-label="原作导航">
    <button id="menu">原作菜单</button><button id="story">十幅故事</button><button id="levels">八关选择</button><button id="pause">暂停</button>
  </nav>
  <div id="stage-wrap"><div id="stage"></div><div id="pause-cover" hidden>已暂停</div></div>
  <p id="caption" role="status">正在加载实验室…</p>
  <section id="scene-controls" aria-label="场景操作"></section>
  <section id="controls" aria-label="指令编辑器" hidden>
    <div class="directions"><button data-direction="0" aria-label="添加向上指令">↑ 向上</button><button data-direction="2" aria-label="添加向左指令">← 向左</button><button data-direction="3" aria-label="添加向下指令">↓ 向下</button><button data-direction="1" aria-label="添加向右指令">→ 向右</button></div>
    <div class="actions"><button id="play">执行序列</button><button id="stop">停止并复位</button><button id="reset">清空并重置</button><span id="queue-label">指令序列</span></div>
    <ol id="queue" aria-labelledby="queue-label"></ol>
    <p class="help">先排好整段路线，再执行。每条指令会一直滑到墙或停靠垫；点击指令可删除。箭头键编排，空格执行或停止，P 暂停。停止保留序列，重置清空。</p>
  </section>
</main>
<script src="phaser.js"></script>
<script src="original/_globals.js"></script>
<script src="original/commands.js"></script><script src="original/mapLoader.js"></script>
<script src="original/states/boot.js"></script><script src="original/states/preloader.js"></script>
<script src="original/states/mainmenu.js"></script><script src="original/states/game.js"></script>
<script src="original/states/credits.js"></script><script src="original/states/levelselector.js"></script>
<script src="original/states/intro.js"></script><script src="original/states/ending.js"></script>
<script src="adapter.js"></script>
</body>
</html>
