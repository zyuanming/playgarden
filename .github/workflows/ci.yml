name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      files: ${{ steps.plan.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/select-browser-tests.test.mjs
      - id: plan
        run: node scripts/select-browser-tests.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    needs: [select, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-browser-tests.mjs
        env:
          BROWSER_MODE: ${{ needs.select.outputs.mode }}
          BROWSER_FILES: ${{ needs.select.outputs.files }}
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_TOTAL: ${{ needs.select.outputs.total }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-shard-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces-shard-${{ matrix.shard }}
          path: test-results/**/trace.zip
          retention-days: 3
