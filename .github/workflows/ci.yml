name: Build and publish
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e_file:
        description: 'One finished game only, e.g. e2e/ataxx.spec.ts; blank means build only'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # build already performs the license-notice check and TypeScript check.
      # Unit tests and campaign enumeration are intentionally paused.
      - run: npm run build -- --base=/playgarden/
      - name: Identify the exact build
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const sha=process.env.GITHUB_SHA;
          if(!/^[a-f0-9]{40}$/.test(sha||''))throw Error('Missing build SHA');
          const html=readFileSync('dist/index.html','utf8');
          writeFileSync('dist/index.html',html.replace('</head>',`<meta name="playgarden-commit" content="${sha}"></head>`));
          NODE
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: review-build
          path: dist
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  final-game-e2e:
    needs: build
    # Small development pushes do not run browser tests. Mark the finished PR
    # ready with a "Final E2E: e2e/name.spec.ts" line to request exactly one run.
    # The current Ataxx release already completed its final E2E in run 37776268426.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.e2e_file != '') ||
      (github.event.action == 'ready_for_review' && contains(github.event.pull_request.body, 'Final E2E:'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Select one finished game
        id: select
        env:
          REQUESTED_FILE: ${{ inputs.e2e_file }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync,existsSync} from 'node:fs';
          const event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const file=process.env.REQUESTED_FILE || event.pull_request?.body?.match(/^Final E2E:\s*(e2e\/[a-z0-9-]+\.spec\.ts)\s*$/m)?.[1];
          if(!file || !/^e2e\/[a-z0-9-]+\.spec\.ts$/.test(file) || !existsSync(file))throw Error('Choose exactly one existing game spec');
          appendFileSync(process.env.GITHUB_OUTPUT,`file=${file}\n`);
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Final desktop and touch-size journey for this game only
        run: npm run test:e2e -- "$E2E_FILE"
        env:
          E2E_FILE: ${{ steps.select.outputs.file }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-game-evidence
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
          retention-days: 3

  pages-deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Do not publish an older build over newer main
        id: current
        run: |
          latest="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; else echo 'deploy=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.deploy == 'true'
        id: deployment
      - uses: actions/setup-node@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: '24'
      - name: Verify public build identity and entry resources without repeating E2E
        if: steps.current.outputs.deploy == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const url=process.env.PAGE_URL,sha=process.env.GITHUB_SHA;
          let html='';
          for(let attempt=0;attempt<12;attempt++){
            const r=await fetch(url,{cache:'no-store'});
            if(r.ok){html=await r.text();if(html.includes(`name="playgarden-commit" content="${sha}"`))break;}
            if(attempt===11)throw Error('Public site does not yet identify the deployed commit');
            await new Promise(r=>setTimeout(r,10000));
          }
          const paths=[...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(m=>new URL(m[1],url));
          if(paths.length<2)throw Error('Missing application entry resources');
          for(const asset of paths){
            if(asset.origin!==new URL(url).origin)continue;
            const r=await fetch(asset);if(!r.ok)throw Error(`Missing entry resource: ${asset.pathname}`);
            const text=await r.text();if(text.length<100 || /^\s*<!doctype html/i.test(text))throw Error(`Invalid entry resource: ${asset.pathname}`);
            console.log('Entry resource OK:',asset.pathname);
          }
          console.log('Public commit and entry verified:',sha,url);
          NODE
