name: Build and publish
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e_file:
        description: 'One to four finished game specs, separated by commas or spaces; blank means build only'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      games: ${{ steps.select.outputs.games }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select finished games for one targeted run each
        id: select
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.e2e_file != '') ||
          (github.event.action == 'ready_for_review' && contains(github.event.pull_request.body, 'Final E2E:'))
        env:
          REQUESTED_FILES: ${{ inputs.e2e_file }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync,existsSync} from 'node:fs';
          const event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const requested=process.env.REQUESTED_FILES || event.pull_request?.body?.match(/^Final E2E:\s*(.+)$/m)?.[1] || '';
          const files=[...new Set(requested.trim().split(/[\s,]+/).filter(Boolean))];
          if(files.length<1 || files.length>4 || files.some(file=>!/^e2e\/[a-z0-9-]+\.spec\.ts$/.test(file) || !existsSync(file)))throw Error('Choose one to four existing game specs');
          const games=files.map(file=>({file,id:file.slice(4,-8)}));
          appendFileSync(process.env.GITHUB_OUTPUT,`games=${JSON.stringify(games)}\n`);
          NODE
      - run: npm ci
      # build already performs the license-notice check and TypeScript check.
      # Unit tests and campaign enumeration are intentionally paused.
      - run: npm run build -- --base=/playgarden/
      - name: Identify the exact build
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const sha=process.env.GITHUB_SHA;
          if(!/^[a-f0-9]{40}$/.test(sha||''))throw Error('Missing build SHA');
          const html=readFileSync('dist/index.html','utf8');
          writeFileSync('dist/index.html',html.replace('</head>',`<meta name="playgarden-commit" content="${sha}"></head>`));
          NODE
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: review-build
          path: dist
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  final-game-e2e:
    needs: build
    # Development pushes only build. A finished small batch runs each requested
    # game's desktop/mobile journey once in its own parallel job.
    if: needs.build.outputs.games != ''
    name: final-game-e2e (${{ matrix.game.id }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        game: ${{ fromJSON(needs.build.outputs.games || '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Final desktop and touch-size journey for this game only
        run: npm run test:e2e -- "$E2E_FILE"
        env:
          E2E_FILE: ${{ matrix.game.file }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-game-evidence-${{ matrix.game.id }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/*.json
          retention-days: 3

  pages-deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Do not publish an older build over newer main
        id: current
        run: |
          latest="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; else echo 'deploy=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.deploy == 'true'
        id: deployment
      - uses: actions/setup-node@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: '24'
      - name: Verify public build identity and entry resources without repeating E2E
        if: steps.current.outputs.deploy == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const {readFileSync}=await import('node:fs');
          const {createHash}=await import('node:crypto');
          const url=process.env.PAGE_URL,sha=process.env.GITHUB_SHA;
          let html='';
          for(let attempt=0;attempt<12;attempt++){
            const r=await fetch(url,{cache:'no-store'});
            if(r.ok){html=await r.text();if(html.includes(`name="playgarden-commit" content="${sha}"`))break;}
            if(attempt===11)throw Error('Public site does not yet identify the deployed commit');
            await new Promise(r=>setTimeout(r,10000));
          }
          const paths=[...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(m=>new URL(m[1],url));
          if(paths.length<2)throw Error('Missing application entry resources');
          const hexaChunks=new Set();
          const hexahedralChunks=new Set();
          const asteroidsChunks=new Set();
          const beatrixChunks=new Set();
          for(const asset of paths){
            if(asset.origin!==new URL(url).origin)continue;
            const r=await fetch(asset);if(!r.ok)throw Error(`Missing entry resource: ${asset.pathname}`);
            const text=await r.text();if(text.length<100 || /^\s*<!doctype html/i.test(text))throw Error(`Invalid entry resource: ${asset.pathname}`);
            console.log('Entry resource OK:',asset.pathname);
            for(const match of text.matchAll(/\.\/HexaBattleGame-[a-zA-Z0-9_-]+\.js/g))hexaChunks.add(new URL(match[0],asset).href);
            for(const match of text.matchAll(/\.\/HexahedralGame-[a-zA-Z0-9_-]+\.js/g))hexahedralChunks.add(new URL(match[0],asset).href);
            for(const match of text.matchAll(/\.\/BeatrixGame-[a-zA-Z0-9_-]+\.js/g))beatrixChunks.add(new URL(match[0],asset).href);
            for(const match of text.matchAll(/\.\/AsteroidsGame-[a-zA-Z0-9_-]+\.js/g))asteroidsChunks.add(new URL(match[0],asset).href);
          }
          if(hexaChunks.size!==1)throw Error('Missing Hexa Battle runtime from public application entry');
          for(const asset of hexaChunks){const r=await fetch(asset,{cache:'no-store'});if(!r.ok)throw Error('Missing public Hexa Battle runtime');const text=await r.text();if(text.length<1000||/^\s*<!doctype html/i.test(text))throw Error('Invalid Hexa Battle runtime');console.log('Hexa Battle runtime OK:',asset);}
          if(hexahedralChunks.size!==1)throw Error('Missing Hexahedral runtime from public application entry');
          for(const asset of hexahedralChunks){const r=await fetch(asset,{cache:'no-store'});if(!r.ok)throw Error('Missing public Hexahedral runtime');const text=await r.text();if(text.length<1000||/^\s*<!doctype html/i.test(text))throw Error('Invalid Hexahedral runtime');console.log('Hexahedral runtime OK:',asset);}
          if(beatrixChunks.size!==1)throw Error('Missing Beatrix runtime from public entry');
          for(const asset of beatrixChunks){const r=await fetch(asset,{cache:'no-store'});if(!r.ok)throw Error('Missing public Beatrix runtime');const text=await r.text();if(text.length<1000||/^\s*<!doctype html/i.test(text))throw Error('Invalid Beatrix runtime');console.log('Beatrix runtime OK:',asset);}
          for(const path of ['beatrix-LICENSE.txt','beatrix-art.svg']){const r=await fetch(new URL(path,url),{cache:'no-store'});if(!r.ok)throw Error('Missing public Beatrix resource: '+path);const digest=bytes=>createHash('sha256').update(bytes).digest('hex');if(digest(Buffer.from(await r.arrayBuffer()))!==digest(readFileSync('public/'+path)))throw Error('Beatrix resource mismatch: '+path);console.log('Beatrix exact resource OK:',path);}
          if(asteroidsChunks.size!==1)throw Error('Missing Asteroids runtime from public entry');
          for(const asset of asteroidsChunks){const r=await fetch(asset,{cache:'no-store'});if(!r.ok)throw Error('Missing public Asteroids runtime');const text=await r.text();if(text.length<1000||/^\s*<!doctype html/i.test(text))throw Error('Invalid Asteroids runtime');console.log('Asteroids runtime OK:',asset);}
          for(const path of ['asteroids-LICENSE.txt','asteroids-art.svg']){const r=await fetch(new URL(path,url),{cache:'no-store'});if(!r.ok)throw Error('Missing public Asteroids resource: '+path);const digest=bytes=>createHash('sha256').update(bytes).digest('hex');if(digest(Buffer.from(await r.arrayBuffer()))!==digest(readFileSync('public/'+path)))throw Error('Asteroids resource mismatch: '+path);console.log('Asteroids exact resource OK:',path);}
          for(const path of ['hexahedral-LICENSE.txt','hexahedral-art.svg']){const r=await fetch(new URL(path,url),{cache:'no-store'});if(!r.ok)throw Error('Missing public Hexahedral resource: '+path);const digest=bytes=>createHash('sha256').update(bytes).digest('hex');if(digest(Buffer.from(await r.arrayBuffer()))!==digest(readFileSync('public/'+path)))throw Error('Hexahedral resource mismatch: '+path);console.log('Hexahedral exact resource OK:',path);}
          for(const path of ['hexa-battle-LICENSE.txt','hexa-battle-art.svg']){const r=await fetch(new URL(path,url),{cache:'no-store'});if(!r.ok)throw Error('Missing public Hexa Battle resource: '+path);const digest=bytes=>createHash('sha256').update(bytes).digest('hex');if(digest(Buffer.from(await r.arrayBuffer()))!==digest(readFileSync('public/'+path)))throw Error('Hexa Battle resource mismatch: '+path);console.log('Hexa Battle exact resource OK:',path);}
          const serverFiles=['index.html','pg-bridge.js','three-local.js','style.css','utilities.css','src/campaign/levels.js','LICENSE.txt','LICENSE-three.txt','LICENSE-tailwind.txt'];
          for(const file of serverFiles){
            const path='server-survival-full/'+file;
            const asset=new URL(path,url),r=await fetch(asset,{cache:'no-store'});
            if(!r.ok)throw Error('Missing local Server Survival resource: '+path);
            const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
            const actual=digest(Buffer.from(await r.arrayBuffer())),expected=digest(readFileSync('public/'+path));
            if(actual!==expected)throw Error('Server Survival resource differs from deployed commit: '+path);
            console.log('Server Survival exact resource OK:',path,actual);
          }
          for(const file of ['index.html','coil.js','geometry.js','bridge.js','style.css','LICENSE.txt']){
            const path='coil-original/'+file;
            const asset=new URL(path,url),r=await fetch(asset,{cache:'no-store'});
            if(!r.ok)throw Error('Missing local Coil resource: '+path);
            const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
            const actual=digest(Buffer.from(await r.arrayBuffer())),expected=digest(readFileSync('public/'+path));
            if(actual!==expected)throw Error('Coil resource differs from deployed commit: '+path);
            console.log('Coil exact resource OK:',path,actual);
          }
          for(const file of ['index.html','hextris.js','style.css','LICENSE.txt']){
            const path='hextris-original/'+file;
            const asset=new URL(path,url),r=await fetch(asset,{cache:'no-store'});
            if(!r.ok)throw Error('Missing local Hextris resource: '+path);
            const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
            const actual=digest(Buffer.from(await r.arrayBuffer())),expected=digest(readFileSync('public/'+path));
            if(actual!==expected)throw Error('Hextris resource differs from deployed commit: '+path);
            console.log('Hextris exact resource OK:',path,actual);
          }
          const crispFiles=['audio.js','engine.js','lifecycle.js','bridge.js','frame.css','LICENSES.txt',...['castn','bamboo','parking','pizzaarrow','rps','swingby'].flatMap(game=>['index.html','main.js','observe.js'].map(file=>game+'/'+file))];
          for(const file of crispFiles){
            const path='crisp-original/'+file;
            const asset=new URL(path,url),r=await fetch(asset,{cache:'no-store'});
            if(!r.ok)throw Error('Missing local crisp resource: '+path);
            const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
            const actual=digest(Buffer.from(await r.arrayBuffer())),expected=digest(readFileSync('public/'+path));
            if(actual!==expected)throw Error('Crisp resource differs from deployed commit: '+path);
            console.log('Crisp exact resource OK:',path,actual);
          }
          const adrFiles=["LICENSES.txt","bridge.js","css/dark.css","css/main.css","css/outside.css","css/path.css","css/room.css","css/ship.css","css/space.css","css/world.css","css/zh_cn.css","dictionary.js","index.html","lib/jquery.color.js","lib/jquery.js","lifecycle.js","responsive.css","script/Button.js","script/engine.js","script/events.js","script/events/encounters.js","script/events/global.js","script/events/outside.js","script/events/room.js","script/events/setpieces.js","script/header.js","script/notifications.js","script/outside.js","script/path.js","script/prestige.js","script/room.js","script/scoring.js","script/ship.js","script/space.js","script/state_manager.js","script/world.js","storage.js"];
          for(const file of adrFiles){
            const path='adr-original/'+file;
            const asset=new URL(path,url),r=await fetch(asset,{cache:'no-store'});
            if(!r.ok)throw Error('Missing local A Dark Room resource: '+path);
            const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
            const actual=digest(Buffer.from(await r.arrayBuffer())),expected=digest(readFileSync('public/'+path));
            if(actual!==expected)throw Error('A Dark Room resource differs from deployed commit: '+path);
            console.log('A Dark Room exact resource OK:',path,actual);
          }
          console.log('Public commit and entry verified:',sha,url);
          NODE
