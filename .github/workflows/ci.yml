name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-desktop-evidence
          path: |
            test-results/desktop/**/*.png
            test-results/desktop/**/error-context.md
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-mobile-evidence
          path: |
            test-results/mobile/**/*.png
            test-results/mobile/**/error-context.md
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/**/trace.zip
          retention-days: 7
