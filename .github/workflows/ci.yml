name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      files: ${{ steps.plan.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/select-browser-tests.test.mjs
      - id: plan
        run: node scripts/select-browser-tests.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    needs: [select, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-browser-tests.mjs
        env:
          BROWSER_MODE: ${{ needs.select.outputs.mode }}
          BROWSER_FILES: ${{ needs.select.outputs.files }}
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_TOTAL: ${{ needs.select.outputs.total }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-shard-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces-shard-${{ matrix.shard }}
          path: test-results/**/trace.zip
          retention-days: 3

  pages-build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build for the GitHub Pages project path
        run: npm run build -- --base=/playgarden/
      - name: Stamp the exact published commit into the built document
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const sha = process.env.GITHUB_SHA;
          if (!/^[a-f0-9]{40}$/.test(sha || '')) throw new Error('Missing build SHA');
          const html = readFileSync('dist/index.html', 'utf8');
          writeFileSync('dist/index.html', html.replace('</head>', `<meta name="playgarden-commit" content="${sha}"></head>`));
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Verify production assets, games, refresh, and local saves
        run: npx playwright test --config=playwright.pages.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-preview-evidence
          path: test-results/pages/
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages-deploy:
    needs: [browser, pages-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Do not replace a newer main with an older build
        id: current
        shell: bash
        run: |
          latest="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $GITHUB_SHA; main is $latest."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy verified build to GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: steps.current.outputs.deploy == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.current.outputs.deploy == 'true'
      - name: Verify the real public website
        if: steps.current.outputs.deploy == 'true'
        run: npx playwright test --config=playwright.pages.config.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.current.outputs.deploy == 'true'
        with:
          name: pages-public-evidence
          path: test-results/pages/
          retention-days: 3
