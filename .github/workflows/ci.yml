          for(const asset of paths){
            if(asset.origin!==new URL(url).origin)continue;
            const r=await fetch(asset);if(!r.ok)throw Error(`Missing entry resource: ${asset.pathname}`);
            const text=await r.text();if(text.length<100 || /^\s*<!doctype html/i.test(text))throw Error(`Invalid entry resource: ${asset.pathname}`);
            console.log('Entry resource OK:',asset.pathname);
            for(const match of text.matchAll(/\.\/HexaBattleGame-[a-zA-Z0-9_-]+\.js/g))hexaChunks.add(new URL(match[0],asset).href);
            for(const match of text.matchAll(/\.\/HexahedralGame-[a-zA-Z0-9_-]+\.js/g))hexahedralChunks.add(new URL(match[0],asset).href);
            for(const match of text.matchAll(/\.\/VikingGame-[a-zA-Z0-9_-]+\.js/g))vikingChunks.add(new URL(match[0],asset).href);
            for(const [name,found] of Object.entries(batchChunks))for(const match of text.matchAll(new RegExp("\\./"+name+"-[a-zA-Z0-9_-]+\\.js","g")))found.add(new URL(match[0],asset).href);
            for(const match of text.matchAll(/\.\/BeatrixGame-[a-zA-Z0-9_-]+\.js/g))beatrixChunks.add(new URL(match[0],asset).href);
            for(const match of text.matchAll(/\.\/AsteroidsGame-[a-zA-Z0-9_-]+\.js/g))asteroidsChunks.add(new URL(match[0],asset).href);
          }
          if(hexaChunks.size!==1)throw Error('Missing Hexa Battle runtime from public application entry');
          for(const asset of hexaChunks){const r=await fetch(asset,{cache:'no-store'});if(!r.ok)throw Error('Missing public Hexa Battle runtime');const text=await r.text();if(text.length<1000||/^\s*<!doctype html/i.test(text))throw Error('Invalid Hexa Battle runtime');console.log('Hexa Battle runtime OK:',asset);}
          if(hexahedralChunks.size!==1)throw Error('Missing Hexahedral runtime from public application entry');
          for(const asset of hexahedralChunks){const r=await fetch(asset,{cache:'no-store'});if(!r.ok)throw Error('Missing public Hexahedral runtime');const text=await r.text();if(text.length<1000||/^\s*<!doctype html/i.test(text))throw Error('Invalid Hexahedral runtime');console.log('Hexahedral runtime OK:',asset);}
